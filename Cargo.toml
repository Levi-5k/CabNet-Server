[package]
name = "codebar-server"
version = "0.2.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["json", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "decompression-gzip", "compression-gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# GUI
eframe = "0.28"
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# QR Code generation
qrcode = "0.14"
image = "0.25"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
local-ip-address = "0.6"
dirs = "5.0"
rfd = "0.14"
regex = "1.10"
open = "5"
rand = "0.8"
md5 = "0.7"
flate2 = "1.0"

# CSV export
csv = "1.3"
